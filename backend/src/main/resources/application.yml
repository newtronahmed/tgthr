spring:
  application:
    name: collections-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/collections}
    username: ${DATABASE_USER:collections}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

collections:
  payments:
    account-resolver: ${ACCOUNT_RESOLVER:none}
    paystack:
      base-url: ${PAYSTACK_BASE_URL:https://api.paystack.co}
      secret-key: ${PAYSTACK_SECRET_KEY:}
      connect-timeout: ${PAYSTACK_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${PAYSTACK_READ_TIMEOUT:PT5S}
  security:
    payer-phone-key: ${PAYER_PHONE_KEY:}
    cookie-secure: ${COOKIE_SECURE:true}
  identity:
    otp-ttl: ${OTP_TTL:PT5M}
    otp-max-attempts: ${OTP_MAX_ATTEMPTS:5}
    otp-resend-seconds: ${OTP_RESEND_SECONDS:60}
    session-ttl: ${SESSION_TTL:P30D}
    retention: ${IDENTITY_RETENTION:P1D}
  sms:
    provider: ${SMS_PROVIDER:none}
  web:
    origin: ${WEB_ORIGIN:http://localhost:3000}
  contribution:
    platform-fee-bps: ${PLATFORM_FEE_BPS:150}
    paystack-fee-bps: ${PAYSTACK_FEE_BPS:195}
    timeout: ${CONTRIBUTION_TIMEOUT:PT5M}
  payout:
    stuck-after: ${PAYOUT_STUCK_AFTER:PT10M}
    stuck-scan-ms: ${PAYOUT_STUCK_SCAN_MS:60000}
    provider-timeout: ${PAYOUT_PROVIDER_TIMEOUT:PT5S}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    per-ip-per-minute: ${RATE_LIMIT_PER_IP_PER_MINUTE:30}
    per-phone-per-minute: ${RATE_LIMIT_PER_PHONE_PER_MINUTE:5}
    otp-per-phone-per-minute: ${OTP_RATE_LIMIT_PER_PHONE_PER_MINUTE:3}
    otp-per-ip-per-minute: ${OTP_RATE_LIMIT_PER_IP_PER_MINUTE:10}
    otp-verify-per-phone-per-minute: ${OTP_VERIFY_RATE_LIMIT_PER_PHONE_PER_MINUTE:10}
    otp-verify-per-ip-per-minute: ${OTP_VERIFY_RATE_LIMIT_PER_IP_PER_MINUTE:20}
    goal-per-user-per-minute: ${GOAL_RATE_LIMIT_PER_USER_PER_MINUTE:10}
    approval-per-ip-per-minute: ${APPROVAL_RATE_LIMIT_PER_IP_PER_MINUTE:20}
    approval-per-approver-per-minute: ${APPROVAL_RATE_LIMIT_PER_APPROVER_PER_MINUTE:5}
    payout-report-per-ip-per-minute: ${PAYOUT_REPORT_RATE_LIMIT_PER_IP_PER_MINUTE:10}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"

server:
  forward-headers-strategy: framework
  servlet:
    context-path: /v1

management:
  endpoints:
    web:
      exposure:
        include: health,info
