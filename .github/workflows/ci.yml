name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  specs:
    name: Specs and API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Spec to test traceability
        run: python3 tools/check_traceability.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint OpenAPI
        run: npx --yes @stoplight/spectral-cli lint specs/api/openapi.yaml --ruleset specs/api/.spectral.yaml

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Format check, tests and coverage gates
        run: ./gradlew spotlessCheck check
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build and type-check
        run: npm run build
      - name: Page-weight budget
        run: npm run budget

  e2e:
    name: Web E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: collections
          POSTGRES_USER: collections
          POSTGRES_PASSWORD: collections
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Start fake Paystack
        env:
          PORT: "9099"
          PAYSTACK_SECRET_KEY: test-secret
          WEBHOOK_URL: http://127.0.0.1:8090/v1/webhooks/momo
        run: |
          nohup node tools/paystack-fake/server.mjs > /tmp/fake.log 2>&1 &
          echo $! > /tmp/fake.pid
      - name: Start backend
        run: |
          cd backend
          nohup env             DATABASE_URL=jdbc:postgresql://127.0.0.1:5432/collections             DATABASE_USER=collections             DATABASE_PASSWORD=collections             SERVER_PORT=8090             PAYSTACK_BASE_URL=http://127.0.0.1:9099             PAYSTACK_SECRET_KEY=test-secret             PAYER_PHONE_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=             SPRING_PROFILES_ACTIVE=e2e             SMS_PROVIDER=dev             ACCOUNT_RESOLVER=dev             COOKIE_SECURE=false             WEB_ORIGIN=http://127.0.0.1:3200             COLLECTIONS_PAYOUT_ENABLED=true             COLLECTIONS_PAYOUT_FEE_PROVIDER=configured             COLLECTIONS_PAYOUT_TRANSFER_FEE_MINOR_UNITS=100             ./gradlew bootRun > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:8090/v1/actuator/health >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8090/v1/actuator/health >/dev/null || (tail -100 /tmp/backend.log && exit 1)
      - name: Seed the E2E goal
        run: PGPASSWORD=collections psql -h 127.0.0.1 -U collections -d collections -f web/e2e/seed.sql
      - name: Install and build web
        working-directory: web
        run: |
          npm ci
          API_BASE_URL=http://127.0.0.1:8090/v1 npm run build
      - name: Start web
        working-directory: web
        run: |
          API_BASE_URL=http://127.0.0.1:8090/v1 nohup npm run start -- --port 3200 > /tmp/web.log 2>&1 &
          echo $! > /tmp/web.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3200/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3200/ >/dev/null || (tail -100 /tmp/web.log && exit 1)
      - name: Install Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: web
        env:
          E2E_BASE_URL: http://127.0.0.1:3200
          PAYSTACK_FAKE_URL: http://127.0.0.1:9099
          BACKEND_URL: http://127.0.0.1:8090/v1
        run: npm run e2e
