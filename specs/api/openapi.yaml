openapi: 3.0.3
info:
  title: Group Collections API
  version: 0.4.0
  description: |
    Contract for the Group Collections backend. This file is the single source of truth for HTTP
    behavior (Constitution Article II.4). Amounts are integer pesewas (GHS minor unit).
servers:
  - url: http://localhost:8080/v1
    description: Local development
tags:
  - name: Public
    description: No login required
  - name: Webhooks
    description: Called by the payment partner, never by clients
  - name: Organizer
    description: Phone-verified organizer account, session and own goals
  - name: Approval
    description: Public SMS-token approval for a designated group member
paths:
  /public/goals/{slug}:
    get:
      tags: [Public]
      operationId: getPublicGoal
      summary: Read the public view of a goal
      parameters:
        - $ref: '#/components/parameters/GoalSlug'
      responses:
        '200':
          description: The goal as shown on the public page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicGoal'
        '404':
          $ref: '#/components/responses/Problem'
  /public/goals/{slug}/contributions:
    post:
      tags: [Public]
      operationId: createContribution
      summary: Start a contribution and request the MoMo prompt
      parameters:
        - $ref: '#/components/parameters/GoalSlug'
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated key; a retry with the same key returns the original contribution.
          schema:
            type: string
            minLength: 8
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContribution'
      responses:
        '202':
          description: Contribution accepted; the prompt was requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributionStatus'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /public/goals/{slug}/contribution-quote:
    post:
      tags: [Public]
      operationId: quoteContribution
      summary: Preview the exact fees for an amount without starting a payment
      parameters:
        - $ref: '#/components/parameters/GoalSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContributionQuote'
      responses:
        '200':
          description: Fee breakdown for the amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeQuote'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /public/contributions/{id}:
    get:
      tags: [Public]
      operationId: getContribution
      summary: Read a contribution's state, with the receipt once confirmed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current state of the contribution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributionStatus'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /webhooks/momo:
    post:
      tags: [Webhooks]
      operationId: receiveMomoCallback
      summary: Receive a payment result from the partner
      parameters:
        - name: x-paystack-signature
          in: header
          required: true
          description: HMAC-SHA512 of the raw request body using the Paystack secret key.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaystackWebhook'
      responses:
        '204':
          description: Callback accepted (also returned for a repeated callback)
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /auth/otp/request:
    post:
      tags: [Organizer]
      operationId: requestOtp
      summary: Send a six-digit code to an organizer's phone
      description: The response never reveals whether the number already has an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: Code accepted for delivery
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/otp/verify:
    post:
      tags: [Organizer]
      operationId: verifyOtp
      summary: Verify the code, create the account on first use and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
      responses:
        '200':
          description: The organizer profile; the session is set as an HttpOnly cookie
          headers:
            Set-Cookie:
              description: Opaque key tgthr_session; attribute policy HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=2592000
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerProfile'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      tags: [Organizer]
      operationId: logout
      summary: Revoke the current session and clear the cookie
      responses:
        '204':
          description: Session revoked, or there was no session
          headers:
            Set-Cookie:
              description: Clears tgthr_session (Max-Age=0; HttpOnly; Secure; SameSite=Lax; Path=/)
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Problem'
  /public/goals/{slug}/payouts/{payoutId}/report:
    post:
      tags: [Public]
      operationId: reportPayout
      summary: Report a problem with a visible payout
      description: Only HOLD/READY/EXECUTING/COMPLETED payouts are reportable. Store and alert; the payout state is never changed by a report.
      parameters:
        - $ref: '#/components/parameters/GoalSlug'
        - name: payoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutReport'
      responses:
        '202':
          description: Report accepted
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /organizer/me:
    get:
      tags: [Organizer]
      operationId: getOrganizer
      summary: Read the signed-in organizer's profile
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The organizer profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerProfile'
        '401':
          $ref: '#/components/responses/Problem'
  /organizer/goals:
    get:
      tags: [Organizer]
      operationId: listOrganizerGoals
      summary: List the signed-in organizer's goals
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The organizer's goals, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizerGoal'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Organizer]
      operationId: createGoal
      summary: Create a goal with a locked, name-matched payout destination
      security:
        - cookieAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique per organizer; a retry returns the original goal.
          schema:
            type: string
            minLength: 8
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoal'
      responses:
        '201':
          description: Goal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerGoal'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /organizer/goals/{id}:
    get:
      tags: [Organizer]
      operationId: getOrganizerGoal
      summary: Read one of the signed-in organizer's goals
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: The organizer's goal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerGoal'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /organizer/goals/{id}/payout-settings:
    patch:
      tags: [Organizer]
      operationId: updateGoalPayoutSettings
      summary: Set the second approver and hold before the first payout
      description: |
        The approver name and phone must be supplied together and the phone must differ from the
        organizer. The phone is encrypted and never returned. Settings cannot change after the
        first payout; a hold below the configured minimum (at least one minute) is refused with
        HOLD_REQUIRED.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/GoalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutSettings'
      responses:
        '200':
          description: The updated goal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerGoal'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /organizer/goals/{id}/payout-quote:
    get:
      tags: [Organizer]
      operationId: getPayoutQuote
      summary: Quote the fee, net and available settled balance for a payout
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - name: amountPesewas
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Payout quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutQuote'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /organizer/goals/{id}/payouts:
    get:
      tags: [Organizer]
      operationId: listPayouts
      summary: List the organizer's payouts for one goal
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: Payouts newest first; never contains a phone
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PayoutView'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Organizer]
      operationId: requestPayout
      summary: Reserve a partial payout against the settled available balance
      description: |
        The payout is all-in: the goal bears the provider fee and the beneficiary receives
        amountPesewas minus feePesewas. The request reserves the amount until cancel/failure.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique per goal; the same key and amount returns the original payout.
          schema:
            type: string
            minLength: 8
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutRequest'
      responses:
        '201':
          description: Payout requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutView'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /organizer/payouts/{id}/cancel:
    post:
      tags: [Organizer]
      operationId: cancelPayout
      summary: Cancel a payout before execution
      description: Allowed in REQUESTED, APPROVED, HOLD or READY; EXECUTING and terminal payouts return 409.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The cancelled payout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutView'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /organizer/goals/{id}/close:
    post:
      tags: [Organizer]
      operationId: closeGoal
      summary: Close one of the signed-in organizer's goals
      description: Closing an already closed goal is a no-op.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: The closed goal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerGoal'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /payout-approvals/{token}:
    get:
      tags: [Approval]
      operationId: getPayoutApproval
      summary: Read the pending payout for an approval token
      parameters:
        - $ref: '#/components/parameters/ApprovalToken'
      responses:
        '200':
          description: Approval page data; never contains a phone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutApprovalView'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /payout-approvals/{token}/verify:
    post:
      tags: [Approval]
      operationId: verifyPayoutApproval
      summary: Verify the SMS code and start the hold
      parameters:
        - $ref: '#/components/parameters/ApprovalToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutApprovalVerify'
      responses:
        '200':
          description: Approved payout in HOLD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutView'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /payout-approvals/{token}/resend:
    post:
      tags: [Approval]
      operationId: resendPayoutApproval
      summary: Invalidate the previous values and send a new SMS
      parameters:
        - $ref: '#/components/parameters/ApprovalToken'
      responses:
        '202':
          description: A new approval SMS was sent
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /payout-approvals/{token}/decline:
    post:
      tags: [Approval]
      operationId: declinePayoutApproval
      summary: Decline the payout and release its reservation
      parameters:
        - $ref: '#/components/parameters/ApprovalToken'
      responses:
        '200':
          description: Cancelled payout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutView'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: tgthr_session
  parameters:
    GoalSlug:
      name: slug
      in: path
      required: true
      description: Unguessable goal slug from the share link
      schema:
        type: string
        minLength: 8
        maxLength: 64
    ApprovalToken:
      name: token
      in: path
      required: true
      description: Raw approval token from the SMS; hashed at rest.
      schema:
        type: string
        minLength: 20
    GoalId:
      name: id
      in: path
      required: true
      description: Goal identifier
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Error in RFC 9457 problem format
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    PublicGoal:
      type: object
      required: [slug, title, template, targetType, minimumAmountPesewas, raisedPesewas, contributorCount, status, payoutRules, payouts, feed]
      properties:
        slug:
          type: string
        title:
          type: string
        template:
          type: string
          enum: [TRIP, WEDDING, FUNERAL, RENT, COMMUNITY, GIFT, PARTY]
        targetType:
          type: string
          enum: [FIXED, OPEN]
        fixedAmountPesewas:
          type: integer
          format: int64
          nullable: true
          description: Present when targetType is FIXED
        targetAmountPesewas:
          type: integer
          format: int64
          nullable: true
        minimumAmountPesewas:
          type: integer
          format: int64
          description: Smallest amount an open goal accepts.
        raisedPesewas:
          type: integer
          format: int64
        contributorCount:
          type: integer
          description: Number of confirmed contributions (not distinct people).
        deadline:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [OPEN, CLOSED, FROZEN]
        payoutRules:
          $ref: '#/components/schemas/PayoutRules'
        payouts:
          type: array
          description: Held and sent payouts; never contains a phone.
          items:
            $ref: '#/components/schemas/PayoutPublicView'
        feed:
          type: array
          description: Up to 20 confirmed contributions, newest first.
          items:
            $ref: '#/components/schemas/FeedItem'
    PayoutRules:
      type: object
      description: Settings that affect contributors' money, shown on the public page (Constitution V.5)
      required: [destinationType, secondApproverName, secondApprover, secondApproverThresholdPesewas, holdWindowMinutes, surplusRule]
      properties:
        destinationType:
          type: string
          enum: [BENEFICIARY_MOMO, ADMIN_MOMO]
        secondApproverName:
          type: string
          nullable: true
          description: The designated approver's name; the phone is never public.
        secondApprover:
          type: string
          enum: [OFF, ABOVE_THRESHOLD, ALWAYS]
        secondApproverThresholdPesewas:
          type: integer
          format: int64
          description: Payout debit X at or above which a second approval is required.
        holdWindowMinutes:
          type: integer
          description: Must be at least the configured minimum (at least 1); a lower value is refused with 422 HOLD_REQUIRED.
        surplusRule:
          type: string
          enum: [PAY_BENEFICIARY, WELFARE_RESERVE]
    FeedItem:
      type: object
      required: [anonymous, amountPesewas, at]
      properties:
        displayName:
          type: string
          nullable: true
          description: Null when anonymous
        anonymous:
          type: boolean
        amountPesewas:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
    CreateContribution:
      type: object
      required: [amountPesewas, momoNumber, network]
      properties:
        amountPesewas:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000000
        displayName:
          type: string
          maxLength: 80
        anonymous:
          type: boolean
          default: false
        momoNumber:
          type: string
          description: Payer's mobile money number. Accepted on input, never returned by any endpoint.
          pattern: '^0[0-9]{9}$'
        network:
          type: string
          enum: [MTN, TELECEL, AT]
    ContributionQuote:
      type: object
      required: [amountPesewas]
      properties:
        amountPesewas:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000000
    FeeQuote:
      type: object
      required: [amountPesewas, processingFeePesewas, platformFeePesewas, totalPesewas]
      properties:
        amountPesewas:
          type: integer
          format: int64
        processingFeePesewas:
          type: integer
          format: int64
        platformFeePesewas:
          type: integer
          format: int64
        totalPesewas:
          type: integer
          format: int64
    ContributionStatus:
      type: object
      required: [id, state, amountPesewas, processingFeePesewas, platformFeePesewas, feePesewas, totalPesewas]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [INITIATED, PENDING, CONFIRMED, FAILED, EXPIRED, REFUNDED]
        amountPesewas:
          type: integer
          format: int64
          description: The contribution amount that counts toward the goal.
        processingFeePesewas:
          type: integer
          format: int64
          description: Paystack's processing fee, borne by the contributor.
        platformFeePesewas:
          type: integer
          format: int64
          description: The platform service fee, 1.5% of amountPesewas rounded up to the nearest pesewa.
        feePesewas:
          type: integer
          format: int64
          deprecated: true
          description: Deprecated. The sum of processingFeePesewas and platformFeePesewas.
        totalPesewas:
          type: integer
          format: int64
          description: amountPesewas plus processingFeePesewas plus platformFeePesewas.
        receipt:
          allOf:
            - $ref: '#/components/schemas/Receipt'
          nullable: true
          description: Present only when state is CONFIRMED
    Receipt:
      type: object
      required: [reference, confirmedAt]
      properties:
        reference:
          type: string
        confirmedAt:
          type: string
          format: date-time
    PaystackWebhook:
      type: object
      required: [event, data]
      description: The subset of Paystack's charge webhook that the adapter reads.
      properties:
        event:
          type: string
          enum: [charge.success, charge.failed]
        data:
          type: object
          required: [reference, status, amount, paid_at]
          properties:
            reference:
              type: string
            status:
              type: string
              enum: [success, failed]
            amount:
              type: integer
              format: int64
              description: Amount charged in pesewas.
            currency:
              type: string
              enum: [GHS]
            paid_at:
              type: string
              format: date-time
              nullable: true
    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: Ghanaian mobile number, local or E.164. Never returned.
          pattern: '^(\+233|0)[0-9]{9}$'
    OtpVerify:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          pattern: '^(\+233|0)[0-9]{9}$'
        code:
          type: string
          pattern: '^[0-9]{6}$'
        displayName:
          type: string
          maxLength: 80
          description: Used when the account is created; a returning organizer can correct it.
        legalName:
          type: string
          maxLength: 120
          description: Self-declared legal name; a returning organizer can correct it. Required before an ADMIN_MOMO goal.
    OrganizerProfile:
      type: object
      required: [id, createdAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        legalName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      description: Never contains the phone number.
    CreateGoal:
      type: object
      required: [title, template, targetType, deadline, destinationType, destinationPhone, network, secondApprover]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        template:
          type: string
          enum: [TRIP, WEDDING, FUNERAL, RENT, COMMUNITY, GIFT, PARTY]
        targetType:
          type: string
          enum: [FIXED, OPEN]
        fixedAmountPesewas:
          type: integer
          format: int64
          minimum: 1
          description: Required when targetType is FIXED.
        targetAmountPesewas:
          type: integer
          format: int64
          minimum: 1
          description: Optional target for an open goal.
        minimumAmountPesewas:
          type: integer
          format: int64
          minimum: 1000
          description: Required when targetType is OPEN; at least 1,000 pesewas.
        deadline:
          type: string
          format: date-time
          description: Must be in the future.
        destinationType:
          type: string
          enum: [BENEFICIARY_MOMO, ADMIN_MOMO]
        destinationPhone:
          type: string
          description: Payout MoMo number (local or E.164). Encrypted at rest, never returned.
          pattern: '^(\+233|0)[0-9]{9}$'
        network:
          type: string
          enum: [MTN, TELECEL, AT]
        secondApprover:
          type: string
          enum: [OFF, ABOVE_THRESHOLD, ALWAYS]
        secondApproverName:
          type: string
          maxLength: 120
          nullable: true
          description: May be supplied at creation or via payout-settings; required before the first payout for a non-OFF rule.
        secondApproverPhone:
          type: string
          nullable: true
          description: Disposable input; encrypted and never returned or logged.
          pattern: '^(\+233|0)[0-9]{9}$'
        secondApproverThresholdPesewas:
          type: integer
          format: int64
          minimum: 0
          default: 50000
        holdWindowMinutes:
          type: integer
          minimum: 0
          maximum: 1440
          default: 60
          description: Must be at least the configured minimum (at least 1); a lower value is refused with 422 HOLD_REQUIRED.
        surplusRule:
          type: string
          enum: [PAY_BENEFICIARY, WELFARE_RESERVE]
          default: PAY_BENEFICIARY
    PayoutRequest:
      type: object
      required: [amountPesewas]
      properties:
        amountPesewas:
          type: integer
          format: int64
          minimum: 1
          description: All-in goal-pool debit; the provider fee is deducted from this amount.
    PayoutQuote:
      type: object
      required: [amountPesewas, feePesewas, netPesewas, availablePesewas, currency]
      properties:
        amountPesewas:
          type: integer
          format: int64
        feePesewas:
          type: integer
          format: int64
        netPesewas:
          type: integer
          format: int64
        availablePesewas:
          type: integer
          format: int64
        currency:
          type: string
          enum: [GHS]
    PayoutView:
      type: object
      required: [id, goalId, amountPesewas, feePesewas, netPesewas, currency, state, createdAt]
      properties:
        id:
          type: string
          format: uuid
        goalId:
          type: string
          format: uuid
        amountPesewas:
          type: integer
          format: int64
        feePesewas:
          type: integer
          format: int64
        netPesewas:
          type: integer
          format: int64
        currency:
          type: string
          enum: [GHS]
        state:
          type: string
          enum: [REQUESTED, APPROVED, HOLD, READY, EXECUTING, COMPLETED, FAILED, CANCELLED]
        createdAt:
          type: string
          format: date-time
    PayoutApprovalView:
      type: object
      required: [payoutId, goalTitle, approverName, amountPesewas, feePesewas, netPesewas, currency, state, tokenExpiresAt]
      properties:
        payoutId:
          type: string
          format: uuid
        goalTitle:
          type: string
        approverName:
          type: string
        amountPesewas:
          type: integer
          format: int64
        feePesewas:
          type: integer
          format: int64
        netPesewas:
          type: integer
          format: int64
        currency:
          type: string
          enum: [GHS]
        state:
          type: string
          enum: [REQUESTED, APPROVED, HOLD, READY, EXECUTING, COMPLETED, FAILED, CANCELLED]
        tokenExpiresAt:
          type: string
          format: date-time
      description: Never contains either phone number.
    PayoutApprovalVerify:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
    PayoutPublicView:
      type: object
      required: [id, amountPesewas, feePesewas, netPesewas, currency, state]
      properties:
        id:
          type: string
          format: uuid
        amountPesewas:
          type: integer
          format: int64
        feePesewas:
          type: integer
          format: int64
        netPesewas:
          type: integer
          format: int64
        currency:
          type: string
          enum: [GHS]
        state:
          type: string
          enum: [HOLD, READY, EXECUTING, COMPLETED]
        holdExpiresAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
      description: Public payout data; never contains a phone.
    PayoutReport:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        contributionId:
          type: string
          format: uuid
          nullable: true
    PayoutSettings:
      type: object
      minProperties: 1
      description: Supplying an approver requires both name and phone. A hold below the configured minimum (at least one minute) is refused with 422 HOLD_REQUIRED.
      properties:
        secondApproverName:
          type: string
          maxLength: 120
        secondApproverPhone:
          type: string
          description: Disposable input; encrypted and never returned or logged.
          pattern: '^(\+233|0)[0-9]{9}$'
        holdWindowMinutes:
          type: integer
          minimum: 0
          maximum: 1440
          description: Must be at least the configured minimum (at least 1); a lower value is refused with 422 HOLD_REQUIRED.
    OrganizerGoal:
      type: object
      required: [id, slug, title, template, targetType, status, deadline, destinationType, destinationAccountName, secondApproverName, secondApprover, secondApproverThresholdPesewas, holdWindowMinutes, surplusRule, raisedPesewas, contributorCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          minLength: 12
        title:
          type: string
        template:
          type: string
          enum: [TRIP, WEDDING, FUNERAL, RENT, COMMUNITY, GIFT, PARTY]
        targetType:
          type: string
          enum: [FIXED, OPEN]
        fixedAmountPesewas:
          type: integer
          format: int64
          nullable: true
        targetAmountPesewas:
          type: integer
          format: int64
          nullable: true
        minimumAmountPesewas:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          enum: [OPEN, CLOSED, FROZEN]
        deadline:
          type: string
          format: date-time
          nullable: true
        destinationType:
          type: string
          enum: [BENEFICIARY_MOMO, ADMIN_MOMO]
        destinationAccountName:
          type: string
          description: Name resolved by the payment partner; never the destination phone.
        secondApproverName:
          type: string
          nullable: true
          description: The designated approver's name; the phone is never returned.
        secondApprover:
          type: string
          enum: [OFF, ABOVE_THRESHOLD, ALWAYS]
        secondApproverThresholdPesewas:
          type: integer
          format: int64
        holdWindowMinutes:
          type: integer
        surplusRule:
          type: string
          enum: [PAY_BENEFICIARY, WELFARE_RESERVE]
        raisedPesewas:
          type: integer
          format: int64
          description: Derived from the ledger, never stored on the goal.
        contributorCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Stable machine-readable code such as AMOUNT_NOT_ALLOWED or GOAL_NOT_ACCEPTING
