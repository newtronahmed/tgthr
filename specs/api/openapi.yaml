openapi: 3.0.3
info:
  title: Group Collections API
  version: 0.4.0
  description: |
    Contract for the Group Collections backend. This file is the single source of truth for HTTP
    behavior (Constitution Article II.4). Amounts are integer pesewas (GHS minor unit).
servers:
  - url: http://localhost:8080/v1
    description: Local development
tags:
  - name: Public
    description: No login required
  - name: Webhooks
    description: Called by the payment partner, never by clients
  - name: Organizer
    description: Phone-verified organizer account, session and own goals
  - name: Operator
    description: Separate per-person operator identity with password and TOTP MFA
  - name: Approval
    description: Public SMS-token approval for a designated group member
paths:
  /public/goals/{slug}:
    get:
      tags: [Public]
      operationId: getPublicGoal
      summary: Read the public view of a goal
      parameters:
        - $ref: '#/components/parameters/GoalSlug'
      responses:
        '200':
          description: The goal as shown on the public page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicGoal'
        '404':
          $ref: '#/components/responses/Problem'
  /public/goals/{slug}/contributions:
    post:
      tags: [Public]
      operationId: createContribution
      summary: Start a contribution and request the MoMo prompt
      parameters:
        - $ref: '#/components/parameters/GoalSlug'
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated key; a retry with the same key returns the original contribution.
          schema:
            type: string
            minLength: 8
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContribution'
      responses:
        '202':
          description: Contribution accepted; the prompt was requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributionStatus'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /public/goals/{slug}/contribution-quote:
    post:
      tags: [Public]
      operationId: quoteContribution
      summary: Preview the exact fees for an amount without starting a payment
      parameters:
        - $ref: '#/components/parameters/GoalSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContributionQuote'
      responses:
        '200':
          description: Fee breakdown for the amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeQuote'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /public/contributions/{id}:
    get:
      tags: [Public]
      operationId: getContribution
      summary: Read a contribution's state, with the receipt once confirmed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current state of the contribution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributionStatus'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /webhooks/momo:
    post:
      tags: [Webhooks]
      operationId: receiveMomoCallback
      summary: Receive a payment result from the partner
      parameters:
        - name: x-paystack-signature
          in: header
          required: true
          description: HMAC-SHA512 of the raw request body using the Paystack secret key.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaystackWebhook'
      responses:
        '204':
          description: Callback accepted (also returned for a repeated callback)
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /auth/otp/request:
    post:
      tags: [Organizer]
      operationId: requestOtp
      summary: Send a six-digit code to an organizer's phone
      description: The response never reveals whether the number already has an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: Code accepted for delivery
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/otp/verify:
    post:
      tags: [Organizer]
      operationId: verifyOtp
      summary: Verify the code, create the account on first use and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
      responses:
        '200':
          description: The organizer profile; the session is set as an HttpOnly cookie
          headers:
            Set-Cookie:
              description: Opaque key tgthr_session; attribute policy HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=2592000
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerProfile'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      tags: [Organizer]
      operationId: logout
      summary: Revoke the current session and clear the cookie
      responses:
        '204':
          description: Session revoked, or there was no session
          headers:
            Set-Cookie:
              description: Clears tgthr_session (Max-Age=0; HttpOnly; Secure; SameSite=Lax; Path=/)
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Problem'
  /operator/auth/login:
    post:
      tags: [Operator]
      operationId: operatorLogin
      summary: Verify the operator password and start an MFA challenge
      description: A session is not issued until the TOTP code is verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorLoginRequest'
      responses:
        '200':
          description: Short-lived MFA challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorLoginResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /operator/auth/mfa:
    post:
      tags: [Operator]
      operationId: operatorMfa
      summary: Verify the TOTP code and start an operator session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorMfaRequest'
      responses:
        '200':
          description: The operator profile; the session is set as an HttpOnly cookie
          headers:
            Set-Cookie:
              description: Opaque key tgthr_operator_session; HttpOnly; Secure; SameSite=Strict; Path=/v1/operator
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorProfile'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /operator/auth/recovery:
    post:
      tags: [Operator]
      operationId: operatorRecovery
      summary: Sign in with a single-use recovery code instead of TOTP
      description: The recovery code is consumed and cannot be reused; sensitive actions still require a fresh TOTP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorRecoveryRequest'
      responses:
        '200':
          description: The operator profile; the session is set as an HttpOnly cookie
          headers:
            Set-Cookie:
              description: Opaque key tgthr_operator_session; HttpOnly; Secure; SameSite=Strict; Path=/v1/operator
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorProfile'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /operator/auth/logout:
    post:
      tags: [Operator]
      operationId: operatorLogout
      summary: Revoke the current operator session and clear the cookie
      responses:
        '204':
          description: Session revoked, or there was no session
          headers:
            Set-Cookie:
              description: Clears tgthr_operator_session (Max-Age=0; HttpOnly; Secure; SameSite=Strict; Path=/v1/operator)
              schema:
                type: string
  /operator/me:
    get:
      tags: [Operator]
      operationId: operatorMe
      summary: Read the signed-in operator and roles
      security:
        - operatorSession: []
      responses:
        '200':
          description: Operator profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorProfile'
        '401':
          $ref: '#/components/responses/Problem'
  /operator/auth/enroll:
    post:
      tags: [Operator]
      operationId: enrollOperator
      summary: Set the password and receive the TOTP secret for an admin-created account
      description: Requires the one-time enrollment token. The TOTP secret is returned once and is never stored in plaintext.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorEnrollmentRequest'
      responses:
        '200':
          description: The TOTP secret, provisioning URI and one-time recovery codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorEnrollmentDetails'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /operator/auth/enroll/confirm:
    post:
      tags: [Operator]
      operationId: confirmOperatorEnrollment
      summary: Verify the first TOTP code and activate the account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorEnrollmentConfirmRequest'
      responses:
        '204':
          description: Account activated and the enrollment token consumed
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /operator/operators:
    post:
      tags: [Operator]
      operationId: createOperator
      summary: Create an operator account and issue a one-time enrollment token
      security:
        - operatorSession: []
      parameters:
        - $ref: '#/components/parameters/OperatorTotpHeader'
        - $ref: '#/components/parameters/OperatorRecoveryHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOperatorRequest'
      responses:
        '200':
          description: The new account and its one-time enrollment token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorCreated'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    get:
      tags: [Operator]
      operationId: listOperators
      summary: List operator accounts without secrets
      security:
        - operatorSession: []
      responses:
        '200':
          description: Operator accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperatorAdminView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /operator/operators/{id}:
    get:
      tags: [Operator]
      operationId: getOperator
      summary: Read one operator account
      security:
        - operatorSession: []
      parameters:
        - $ref: '#/components/parameters/OperatorId'
      responses:
        '200':
          description: Operator account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorAdminView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /operator/operators/{id}/roles:
    put:
      tags: [Operator]
      operationId: changeOperatorRoles
      summary: Replace an operator's roles
      security:
        - operatorSession: []
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '#/components/parameters/OperatorTotpHeader'
        - $ref: '#/components/parameters/OperatorRecoveryHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRolesRequest'
      responses:
        '200':
          description: Updated operator account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorAdminView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /operator/operators/{id}/disable:
    post:
      tags: [Operator]
      operationId: disableOperator
      summary: Disable an operator and revoke their sessions
      security:
        - operatorSession: []
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '#/components/parameters/OperatorTotpHeader'
        - $ref: '#/components/parameters/OperatorRecoveryHeader'
      responses:
        '200':
          description: Updated operator account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorAdminView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /operator/operators/{id}/enable:
    post:
      tags: [Operator]
      operationId: enableOperator
      summary: Enable a disabled operator
      security:
        - operatorSession: []
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '#/components/parameters/OperatorTotpHeader'
        - $ref: '#/components/parameters/OperatorRecoveryHeader'
      responses:
        '200':
          description: Updated operator account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorAdminView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /operator/contributions/{id}/refund:
    post:
      tags: [Operator]
      operationId: requestRefund
      summary: Request a full pre-payout refund
      description: Full A + P + F refund of the original payer. The goal amount is reserved until the provider confirms or fails.
      security:
        - operatorSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique per contribution; the same key and reason returns the original refund.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '201':
          description: Refund requested and reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /operator/refunds/{id}:
    get:
      tags: [Operator]
      operationId: getRefund
      summary: Read a refund
      security:
        - operatorSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Refund
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /operator/refunds:
    get:
      tags: [Operator]
      operationId: listRefunds
      summary: List recent refunds
      security:
        - operatorSession: []
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, PROVIDER_PENDING, SUCCEEDED, FAILED]
      responses:
        '200':
          description: Recent refunds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RefundView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /operator/refunds/{id}/verify:
    post:
      tags: [Operator]
      operationId: verifyRefund
      summary: Ask the provider for a provider-pending refund's result
      security:
        - operatorSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundVerifyRequest'
      responses:
        '200':
          description: Refund after verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /operator/reconciliation/pending:
    get:
      tags: [Operator]
      operationId: listReconciliationQueue
      summary: List unresolved suspense items
      description: Oldest first. Never contains payer phone numbers.
      security:
        - operatorSession: []
      responses:
        '200':
          description: Pending reconciliation items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReconciliationItemView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /operator/reconciliation/{contributionId}/reclassify:
    post:
      tags: [Operator]
      operationId: reclassifySuspense
      summary: Move a suspense amount into the goal pool
      security:
        - operatorSession: []
      parameters:
        - $ref: '#/components/parameters/ReconciliationContributionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconciliationResolutionRequest'
      responses:
        '200':
          description: Reclassification applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationResolutionView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /operator/reconciliation/{contributionId}/refund:
    post:
      tags: [Operator]
      operationId: refundSuspense
      summary: Refund a suspense item to the original payer
      description: Posts the same full A + P + F reversal as a normal refund, but debits SUSPENSE instead of GOAL_POOL.
      security:
        - operatorSession: []
      parameters:
        - $ref: '#/components/parameters/ReconciliationContributionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconciliationResolutionRequest'
      responses:
        '201':
          description: Suspense refund requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /operator/reconciliation/{contributionId}/income:
    post:
      tags: [Operator]
      operationId: proposeSuspenseIncome
      summary: Propose miscellaneous income for an aged suspense item
      security:
        - operatorSession: []
      parameters:
        - $ref: '#/components/parameters/ReconciliationContributionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconciliationResolutionRequest'
      responses:
        '202':
          description: Income proposed and waiting for a finance approver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationResolutionView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /operator/reconciliation/{contributionId}/income/approve:
    post:
      tags: [Operator]
      operationId: approveSuspenseIncome
      summary: Approve and post a proposed miscellaneous income
      security:
        - operatorSession: []
      parameters:
        - $ref: '#/components/parameters/ReconciliationContributionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OperatorTotpHeader'
        - $ref: '#/components/parameters/OperatorRecoveryHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconciliationResolutionRequest'
      responses:
        '200':
          description: Income applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationResolutionView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /public/goals/{slug}/payouts/{payoutId}/report:
    post:
      tags: [Public]
      operationId: reportPayout
      summary: Report a problem with a visible payout
      description: Only HOLD/READY/EXECUTING/COMPLETED payouts are reportable. Store and alert; the payout state is never changed by a report.
      parameters:
        - $ref: '#/components/parameters/GoalSlug'
        - name: payoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutReport'
      responses:
        '202':
          description: Report accepted
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /organizer/me:
    get:
      tags: [Organizer]
      operationId: getOrganizer
      summary: Read the signed-in organizer's profile
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The organizer profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerProfile'
        '401':
          $ref: '#/components/responses/Problem'
  /organizer/goals:
    get:
      tags: [Organizer]
      operationId: listOrganizerGoals
      summary: List the signed-in organizer's goals
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The organizer's goals, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizerGoal'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Organizer]
      operationId: createGoal
      summary: Create a goal with a locked, name-matched payout destination
      security:
        - cookieAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique per organizer; a retry returns the original goal.
          schema:
            type: string
            minLength: 8
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoal'
      responses:
        '201':
          description: Goal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerGoal'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /organizer/goals/{id}:
    get:
      tags: [Organizer]
      operationId: getOrganizerGoal
      summary: Read one of the signed-in organizer's goals
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: The organizer's goal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerGoal'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /organizer/goals/{id}/payout-settings:
    patch:
      tags: [Organizer]
      operationId: updateGoalPayoutSettings
      summary: Set the second approver and hold before the first payout
      description: |
        The approver name and phone must be supplied together and the phone must differ from the
        organizer. The phone is encrypted and never returned. Settings cannot change after the
        first payout; a hold below the configured minimum (at least one minute) is refused with
        HOLD_REQUIRED.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/GoalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutSettings'
      responses:
        '200':
          description: The updated goal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerGoal'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /organizer/goals/{id}/payout-quote:
    get:
      tags: [Organizer]
      operationId: getPayoutQuote
      summary: Quote the fee, net and available settled balance for a payout
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - name: amountPesewas
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Payout quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutQuote'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /organizer/goals/{id}/payouts:
    get:
      tags: [Organizer]
      operationId: listPayouts
      summary: List the organizer's payouts for one goal
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: Payouts newest first; never contains a phone
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PayoutView'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Organizer]
      operationId: requestPayout
      summary: Reserve a partial payout against the settled available balance
      description: |
        The payout is all-in: the goal bears the provider fee and the beneficiary receives
        amountPesewas minus feePesewas. The request reserves the amount until cancel/failure.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique per goal; the same key and amount returns the original payout.
          schema:
            type: string
            minLength: 8
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutRequest'
      responses:
        '201':
          description: Payout requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutView'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /organizer/payouts/{id}/cancel:
    post:
      tags: [Organizer]
      operationId: cancelPayout
      summary: Cancel a payout before execution
      description: Allowed in REQUESTED, APPROVED, HOLD or READY; EXECUTING and terminal payouts return 409.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The cancelled payout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutView'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /organizer/goals/{id}/close:
    post:
      tags: [Organizer]
      operationId: closeGoal
      summary: Close one of the signed-in organizer's goals
      description: Closing an already closed goal is a no-op.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: The closed goal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerGoal'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /payout-approvals/{token}:
    get:
      tags: [Approval]
      operationId: getPayoutApproval
      summary: Read the pending payout for an approval token
      parameters:
        - $ref: '#/components/parameters/ApprovalToken'
      responses:
        '200':
          description: Approval page data; never contains a phone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutApprovalView'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /payout-approvals/{token}/verify:
    post:
      tags: [Approval]
      operationId: verifyPayoutApproval
      summary: Verify the SMS code and start the hold
      parameters:
        - $ref: '#/components/parameters/ApprovalToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutApprovalVerify'
      responses:
        '200':
          description: Approved payout in HOLD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutView'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /payout-approvals/{token}/resend:
    post:
      tags: [Approval]
      operationId: resendPayoutApproval
      summary: Invalidate the previous values and send a new SMS
      parameters:
        - $ref: '#/components/parameters/ApprovalToken'
      responses:
        '202':
          description: A new approval SMS was sent
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /payout-approvals/{token}/decline:
    post:
      tags: [Approval]
      operationId: declinePayoutApproval
      summary: Decline the payout and release its reservation
      parameters:
        - $ref: '#/components/parameters/ApprovalToken'
      responses:
        '200':
          description: Cancelled payout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutView'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: tgthr_session
    operatorSession:
      type: apiKey
      in: cookie
      name: tgthr_operator_session
  parameters:
    GoalSlug:
      name: slug
      in: path
      required: true
      description: Unguessable goal slug from the share link
      schema:
        type: string
        minLength: 8
        maxLength: 64
    ApprovalToken:
      name: token
      in: path
      required: true
      description: Raw approval token from the SMS; hashed at rest.
      schema:
        type: string
        minLength: 20
    GoalId:
      name: id
      in: path
      required: true
      description: Goal identifier
      schema:
        type: string
        format: uuid
    OperatorId:
      name: id
      in: path
      required: true
      description: Operator identifier
      schema:
        type: string
        format: uuid
    OperatorTotpHeader:
      name: X-Operator-TOTP
      in: header
      required: false
      description: Current six-digit TOTP code when the last verification is older than five minutes.
      schema:
        type: string
        pattern: '^[0-9]{6}$'
    OperatorRecoveryHeader:
      name: X-Operator-Recovery-Code
      in: header
      required: false
      description: One unused recovery code when TOTP is unavailable; consumed by the action.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per action and contribution; a retry with the same key and reason is idempotent.
      schema:
        type: string
        minLength: 8
        maxLength: 64
    ReconciliationContributionId:
      name: contributionId
      in: path
      required: true
      description: Contribution parked in suspense.
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Error in RFC 9457 problem format
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    PublicGoal:
      type: object
      required: [slug, title, template, targetType, minimumAmountPesewas, raisedPesewas, contributorCount, status, payoutRules, payouts, feed]
      properties:
        slug:
          type: string
        title:
          type: string
        template:
          type: string
          enum: [TRIP, WEDDING, FUNERAL, RENT, COMMUNITY, GIFT, PARTY]
        targetType:
          type: string
          enum: [FIXED, OPEN]
        fixedAmountPesewas:
          type: integer
          format: int64
          nullable: true
          description: Present when targetType is FIXED
        targetAmountPesewas:
          type: integer
          format: int64
          nullable: true
        minimumAmountPesewas:
          type: integer
          format: int64
          description: Smallest amount an open goal accepts.
        raisedPesewas:
          type: integer
          format: int64
        contributorCount:
          type: integer
          description: Number of confirmed contributions (not distinct people).
        deadline:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [OPEN, CLOSED, FROZEN]
        payoutRules:
          $ref: '#/components/schemas/PayoutRules'
        payouts:
          type: array
          description: Held and sent payouts; never contains a phone.
          items:
            $ref: '#/components/schemas/PayoutPublicView'
        feed:
          type: array
          description: Up to 20 confirmed contributions, newest first.
          items:
            $ref: '#/components/schemas/FeedItem'
    PayoutRules:
      type: object
      description: Settings that affect contributors' money, shown on the public page (Constitution V.5)
      required: [destinationType, secondApproverName, secondApprover, secondApproverThresholdPesewas, holdWindowMinutes, surplusRule]
      properties:
        destinationType:
          type: string
          enum: [BENEFICIARY_MOMO, ADMIN_MOMO]
        secondApproverName:
          type: string
          nullable: true
          description: The designated approver's name; the phone is never public.
        secondApprover:
          type: string
          enum: [OFF, ABOVE_THRESHOLD, ALWAYS]
        secondApproverThresholdPesewas:
          type: integer
          format: int64
          description: Payout debit X at or above which a second approval is required.
        holdWindowMinutes:
          type: integer
          description: Must be at least the configured minimum (at least 1); a lower value is refused with 422 HOLD_REQUIRED.
        surplusRule:
          type: string
          enum: [PAY_BENEFICIARY, WELFARE_RESERVE]
    FeedItem:
      type: object
      required: [anonymous, amountPesewas, at]
      properties:
        displayName:
          type: string
          nullable: true
          description: Null when anonymous
        anonymous:
          type: boolean
        amountPesewas:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
    CreateContribution:
      type: object
      required: [amountPesewas, momoNumber, network]
      properties:
        amountPesewas:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000000
        displayName:
          type: string
          maxLength: 80
        anonymous:
          type: boolean
          default: false
        momoNumber:
          type: string
          description: Payer's mobile money number. Accepted on input, never returned by any endpoint.
          pattern: '^0[0-9]{9}$'
        network:
          type: string
          enum: [MTN, TELECEL, AT]
    ContributionQuote:
      type: object
      required: [amountPesewas]
      properties:
        amountPesewas:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000000
    FeeQuote:
      type: object
      required: [amountPesewas, processingFeePesewas, platformFeePesewas, totalPesewas]
      properties:
        amountPesewas:
          type: integer
          format: int64
        processingFeePesewas:
          type: integer
          format: int64
        platformFeePesewas:
          type: integer
          format: int64
        totalPesewas:
          type: integer
          format: int64
    ContributionStatus:
      type: object
      required: [id, state, amountPesewas, processingFeePesewas, platformFeePesewas, feePesewas, totalPesewas]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [INITIATED, PENDING, CONFIRMED, FAILED, EXPIRED, REFUNDED]
        amountPesewas:
          type: integer
          format: int64
          description: The contribution amount that counts toward the goal.
        processingFeePesewas:
          type: integer
          format: int64
          description: Paystack's processing fee, borne by the contributor.
        platformFeePesewas:
          type: integer
          format: int64
          description: The platform service fee, 1.5% of amountPesewas rounded up to the nearest pesewa.
        feePesewas:
          type: integer
          format: int64
          deprecated: true
          description: Deprecated. The sum of processingFeePesewas and platformFeePesewas.
        totalPesewas:
          type: integer
          format: int64
          description: amountPesewas plus processingFeePesewas plus platformFeePesewas.
        receipt:
          allOf:
            - $ref: '#/components/schemas/Receipt'
          nullable: true
          description: Present only when state is CONFIRMED
    Receipt:
      type: object
      required: [reference, confirmedAt]
      properties:
        reference:
          type: string
        confirmedAt:
          type: string
          format: date-time
    PaystackWebhook:
      type: object
      required: [event, data]
      description: The subset of Paystack's charge webhook that the adapter reads.
      properties:
        event:
          type: string
          enum: [charge.success, charge.failed]
        data:
          type: object
          required: [reference, status, amount, paid_at]
          properties:
            reference:
              type: string
            status:
              type: string
              enum: [success, failed]
            amount:
              type: integer
              format: int64
              description: Amount charged in pesewas.
            currency:
              type: string
              enum: [GHS]
            paid_at:
              type: string
              format: date-time
              nullable: true
    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: Ghanaian mobile number, local or E.164. Never returned.
          pattern: '^(\+233|0)[0-9]{9}$'
    OtpVerify:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          pattern: '^(\+233|0)[0-9]{9}$'
        code:
          type: string
          pattern: '^[0-9]{6}$'
        displayName:
          type: string
          maxLength: 80
          description: Used when the account is created; a returning organizer can correct it.
        legalName:
          type: string
          maxLength: 120
          description: Self-declared legal name; a returning organizer can correct it. Required before an ADMIN_MOMO goal.
    OrganizerProfile:
      type: object
      required: [id, createdAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        legalName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      description: Never contains the phone number.
    CreateGoal:
      type: object
      required: [title, template, targetType, deadline, destinationType, destinationPhone, network, secondApprover]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        template:
          type: string
          enum: [TRIP, WEDDING, FUNERAL, RENT, COMMUNITY, GIFT, PARTY]
        targetType:
          type: string
          enum: [FIXED, OPEN]
        fixedAmountPesewas:
          type: integer
          format: int64
          minimum: 1
          description: Required when targetType is FIXED.
        targetAmountPesewas:
          type: integer
          format: int64
          minimum: 1
          description: Optional target for an open goal.
        minimumAmountPesewas:
          type: integer
          format: int64
          minimum: 1000
          description: Required when targetType is OPEN; at least 1,000 pesewas.
        deadline:
          type: string
          format: date-time
          description: Must be in the future.
        destinationType:
          type: string
          enum: [BENEFICIARY_MOMO, ADMIN_MOMO]
        destinationPhone:
          type: string
          description: Payout MoMo number (local or E.164). Encrypted at rest, never returned.
          pattern: '^(\+233|0)[0-9]{9}$'
        network:
          type: string
          enum: [MTN, TELECEL, AT]
        secondApprover:
          type: string
          enum: [OFF, ABOVE_THRESHOLD, ALWAYS]
        secondApproverName:
          type: string
          maxLength: 120
          nullable: true
          description: May be supplied at creation or via payout-settings; required before the first payout for a non-OFF rule.
        secondApproverPhone:
          type: string
          nullable: true
          description: Disposable input; encrypted and never returned or logged.
          pattern: '^(\+233|0)[0-9]{9}$'
        secondApproverThresholdPesewas:
          type: integer
          format: int64
          minimum: 0
          default: 50000
        holdWindowMinutes:
          type: integer
          minimum: 0
          maximum: 1440
          default: 60
          description: Must be at least the configured minimum (at least 1); a lower value is refused with 422 HOLD_REQUIRED.
        surplusRule:
          type: string
          enum: [PAY_BENEFICIARY, WELFARE_RESERVE]
          default: PAY_BENEFICIARY
    PayoutRequest:
      type: object
      required: [amountPesewas]
      properties:
        amountPesewas:
          type: integer
          format: int64
          minimum: 1
          description: All-in goal-pool debit; the provider fee is deducted from this amount.
    PayoutQuote:
      type: object
      required: [amountPesewas, feePesewas, netPesewas, availablePesewas, currency]
      properties:
        amountPesewas:
          type: integer
          format: int64
        feePesewas:
          type: integer
          format: int64
        netPesewas:
          type: integer
          format: int64
        availablePesewas:
          type: integer
          format: int64
        currency:
          type: string
          enum: [GHS]
    PayoutView:
      type: object
      required: [id, goalId, amountPesewas, feePesewas, netPesewas, currency, state, createdAt]
      properties:
        id:
          type: string
          format: uuid
        goalId:
          type: string
          format: uuid
        amountPesewas:
          type: integer
          format: int64
        feePesewas:
          type: integer
          format: int64
        netPesewas:
          type: integer
          format: int64
        currency:
          type: string
          enum: [GHS]
        state:
          type: string
          enum: [REQUESTED, APPROVED, HOLD, READY, EXECUTING, COMPLETED, FAILED, CANCELLED]
        createdAt:
          type: string
          format: date-time
    PayoutApprovalView:
      type: object
      required: [payoutId, goalTitle, approverName, amountPesewas, feePesewas, netPesewas, currency, state, tokenExpiresAt]
      properties:
        payoutId:
          type: string
          format: uuid
        goalTitle:
          type: string
        approverName:
          type: string
        amountPesewas:
          type: integer
          format: int64
        feePesewas:
          type: integer
          format: int64
        netPesewas:
          type: integer
          format: int64
        currency:
          type: string
          enum: [GHS]
        state:
          type: string
          enum: [REQUESTED, APPROVED, HOLD, READY, EXECUTING, COMPLETED, FAILED, CANCELLED]
        tokenExpiresAt:
          type: string
          format: date-time
      description: Never contains either phone number.
    PayoutApprovalVerify:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
    PayoutPublicView:
      type: object
      required: [id, amountPesewas, feePesewas, netPesewas, currency, state]
      properties:
        id:
          type: string
          format: uuid
        amountPesewas:
          type: integer
          format: int64
        feePesewas:
          type: integer
          format: int64
        netPesewas:
          type: integer
          format: int64
        currency:
          type: string
          enum: [GHS]
        state:
          type: string
          enum: [HOLD, READY, EXECUTING, COMPLETED]
        holdExpiresAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
      description: Public payout data; never contains a phone.
    PayoutReport:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        contributionId:
          type: string
          format: uuid
          nullable: true
    PayoutSettings:
      type: object
      minProperties: 1
      description: Supplying an approver requires both name and phone. A hold below the configured minimum (at least one minute) is refused with 422 HOLD_REQUIRED.
      properties:
        secondApproverName:
          type: string
          maxLength: 120
        secondApproverPhone:
          type: string
          description: Disposable input; encrypted and never returned or logged.
          pattern: '^(\+233|0)[0-9]{9}$'
        holdWindowMinutes:
          type: integer
          minimum: 0
          maximum: 1440
          description: Must be at least the configured minimum (at least 1); a lower value is refused with 422 HOLD_REQUIRED.
    OrganizerGoal:
      type: object
      required: [id, slug, title, template, targetType, status, deadline, destinationType, destinationAccountName, secondApproverName, secondApprover, secondApproverThresholdPesewas, holdWindowMinutes, surplusRule, raisedPesewas, contributorCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          minLength: 12
        title:
          type: string
        template:
          type: string
          enum: [TRIP, WEDDING, FUNERAL, RENT, COMMUNITY, GIFT, PARTY]
        targetType:
          type: string
          enum: [FIXED, OPEN]
        fixedAmountPesewas:
          type: integer
          format: int64
          nullable: true
        targetAmountPesewas:
          type: integer
          format: int64
          nullable: true
        minimumAmountPesewas:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          enum: [OPEN, CLOSED, FROZEN]
        deadline:
          type: string
          format: date-time
          nullable: true
        destinationType:
          type: string
          enum: [BENEFICIARY_MOMO, ADMIN_MOMO]
        destinationAccountName:
          type: string
          description: Name resolved by the payment partner; never the destination phone.
        secondApproverName:
          type: string
          nullable: true
          description: The designated approver's name; the phone is never returned.
        secondApprover:
          type: string
          enum: [OFF, ABOVE_THRESHOLD, ALWAYS]
        secondApproverThresholdPesewas:
          type: integer
          format: int64
        holdWindowMinutes:
          type: integer
        surplusRule:
          type: string
          enum: [PAY_BENEFICIARY, WELFARE_RESERVE]
        raisedPesewas:
          type: integer
          format: int64
          description: Derived from the ledger, never stored on the goal.
        contributorCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    OperatorLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[A-Za-z0-9._-]+$'
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
    OperatorLoginResponse:
      type: object
      required: [challengeToken, expiresAt]
      properties:
        challengeToken:
          type: string
          description: Short-lived MFA challenge token; hashed at rest.
        expiresAt:
          type: string
          format: date-time
    OperatorMfaRequest:
      type: object
      required: [challengeToken, code]
      properties:
        challengeToken:
          type: string
        code:
          type: string
          pattern: '^[0-9]{6}$'
    OperatorRecoveryRequest:
      type: object
      required: [username, password, recoveryCode]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
        recoveryCode:
          type: string
          description: One unused single-use recovery code.
    OperatorProfile:
      type: object
      required: [id, username, roles]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [REFUND_OPERATOR, RECONCILER, FINANCE_APPROVER, OPERATOR_ADMIN]
      description: Never contains a phone number, password hash or TOTP secret.
    CreateOperatorRequest:
      type: object
      required: [username, roles]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[A-Za-z0-9._-]+$'
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OperatorRole'
    ChangeRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OperatorRole'
    OperatorRole:
      type: string
      enum: [REFUND_OPERATOR, RECONCILER, FINANCE_APPROVER, OPERATOR_ADMIN]
    OperatorCreated:
      type: object
      required: [id, username, enrollmentToken, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        enrollmentToken:
          type: string
          description: One-time enrollment token; returned once and stored hashed.
        expiresAt:
          type: string
          format: date-time
    OperatorAdminView:
      type: object
      required: [id, username, status, roles]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        status:
          type: string
          enum: [PENDING_ENROLLMENT, ACTIVE, DISABLED]
        roles:
          type: array
          items:
            $ref: '#/components/schemas/OperatorRole'
    OperatorEnrollmentRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: One-time enrollment token.
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
    OperatorEnrollmentConfirmRequest:
      type: object
      required: [token, code]
      properties:
        token:
          type: string
        code:
          type: string
          pattern: '^[0-9]{6}$'
    OperatorEnrollmentDetails:
      type: object
      required: [totpSecret, otpauthUri, recoveryCodes]
      properties:
        totpSecret:
          type: string
          description: Base32 TOTP secret; returned once.
        otpauthUri:
          type: string
          description: Provisioning URI for an authenticator app.
        recoveryCodes:
          type: array
          items:
            type: string
          description: Ten single-use recovery codes; returned once.
    RefundRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Must not contain a phone number.
    RefundVerifyRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Must not contain a phone number.
    RefundView:
      type: object
      required: [id, contributionId, goalId, sourceAccount, amountMinorUnits, platformFeeMinorUnits, processingFeeMinorUnits, totalMinorUnits, currencyCode, state, operatorId, reason, createdAt]
      properties:
        id:
          type: string
          format: uuid
        contributionId:
          type: string
          format: uuid
        goalId:
          type: string
          format: uuid
        sourceAccount:
          type: string
          enum: [GOAL_POOL, SUSPENSE]
        amountMinorUnits:
          type: integer
          format: int64
        platformFeeMinorUnits:
          type: integer
          format: int64
        processingFeeMinorUnits:
          type: integer
          format: int64
        totalMinorUnits:
          type: integer
          format: int64
        currencyCode:
          type: string
          enum: [GHS]
        state:
          type: string
          enum: [PENDING, PROVIDER_PENDING, SUCCEEDED, FAILED]
        providerReference:
          type: string
          nullable: true
        operatorId:
          type: string
          format: uuid
        reason:
          type: string
        failureCode:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        succeededAt:
          type: string
          format: date-time
          nullable: true
        failedAt:
          type: string
          format: date-time
          nullable: true
    ReconciliationItemView:
      type: object
      required: [contributionId, goalId, goalTitle, amountMinorUnits, currencyCode, providerReference, suspendedAt, ageSeconds]
      description: Never contains payer name, phone number or ciphertext.
      properties:
        contributionId:
          type: string
          format: uuid
        goalId:
          type: string
          format: uuid
        goalTitle:
          type: string
        amountMinorUnits:
          type: integer
          format: int64
        currencyCode:
          type: string
          enum: [GHS]
        providerReference:
          type: string
        suspendedAt:
          type: string
          format: date-time
        ageSeconds:
          type: integer
          format: int64
          minimum: 0
    ReconciliationResolutionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Must not contain a phone number.
    ReconciliationResolutionView:
      type: object
      required: [contributionId, resolution, status, resolvedAt]
      properties:
        contributionId:
          type: string
          format: uuid
        resolution:
          type: string
          enum: [REFUND, RECLASSIFY, INCOME]
        status:
          type: string
          enum: [PROPOSED, APPLIED]
        postingSetId:
          type: string
          format: uuid
          nullable: true
        resolvedAt:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Stable machine-readable code such as AMOUNT_NOT_ALLOWED or GOAL_NOT_ACCEPTING
